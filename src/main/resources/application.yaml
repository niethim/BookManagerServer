spring:
  datasource:
    url: ${DEV_DATABASE_URL:jdbc:postgresql://localhost:5432/BookManager}
    username: ${DEV_DATABASE_USERNAME:postgres}
    password: ${DEV_DATABASE_PASSWORD:postgres123}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
    show-sql: true
logging:
  level:
    org.springframework.web: DEBUG
server:
  servlet:
    context-path: /api
